name: Fireflies → Meeting Note PR

on:
  repository_dispatch:
    types: [fireflies-transcription]

jobs:
  create-meeting-note:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for Fireflies processing
        run: |
          echo "⏳ Waiting 5 minutes for Fireflies to finish processing …"
          sleep 300

      - name: Fetch transcript, summarize, create PR
        env:
          FIREFLIES_API_KEY: ${{ secrets.FIREFLIES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: openai
          OPENAI_MODEL: gpt-5.4
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEETING_ID: ${{ github.event.client_payload.meeting_id }}
          MEETING_TITLE: ${{ github.event.client_payload.title }}
        run: |
          node .github/scripts/fireflies-to-note.js
